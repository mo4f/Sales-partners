<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسبة الشراكة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f4; --surface:#ffffff; --ink:#17202a; --muted:#5f6b7a; --line:#d9dfe6;
  --p0:#2457d6; --p1:#d9822b;
  --good:#17874f; --bad:#c23b3b;
  --field:#f6f8fa;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#12161c; --surface:#1b212a; --ink:#e8ecf1; --muted:#98a3b1; --line:#2b3440;
    --p0:#6c95ff; --p1:#f0a252;
    --good:#4cc98a; --bad:#ff7b7b;
    --field:#141a21;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; padding-bottom:60px;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

.partners{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pname{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pname input{border:0;background:transparent;width:100%;font-weight:700;outline:none;padding:4px 0}
.pname:focus-within{border-color:var(--ink)}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tab.add{border-style:dashed;color:var(--muted)}
.tab.add[aria-current="true"]{border-style:solid;background:var(--ink);color:var(--bg)}

.sharednote{margin:-2px 2px 12px;font-size:13px;color:var(--muted)}
.sharednote.warn{color:var(--bad);background:var(--surface);border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin:0 0 12px;overflow-wrap:anywhere}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.panel h2{font-size:15px;margin:0 0 10px;font-weight:700;color:var(--muted)}
.jobhead{display:flex;gap:8px;align-items:center}
.jobname{flex:1;min-width:0;border:0;border-bottom:2px solid var(--line);background:transparent;font-size:22px;font-weight:800;padding:4px 0;outline:none}
.jobname:focus{border-color:var(--ink)}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:6px 12px;color:var(--muted);font-size:14px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}

.exp{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:0}
.exp .t{flex:1;min-width:0}
.exp .d{font-weight:500;overflow-wrap:anywhere}
.exp .w{font-size:13px;color:var(--muted)}
.exp .a{font-weight:700}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{color:var(--bad)}
.empty{color:var(--muted);padding:6px 0 2px;font-size:15px}

.form{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--field);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 0 0 2px var(--c, var(--ink)) inset}
.row2{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.field{width:100%;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 12px;outline:none}
.field:focus{border-color:var(--ink)}
.primary{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.primary:active{opacity:.85}
.lbl{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.stack{display:grid;gap:14px}

.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.sum small{display:block;color:var(--muted);font-size:13px}
.sum b{font-size:18px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px;background:var(--surface)}
.card h3{margin:0 0 8px;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .r{display:flex;justify-content:space-between;gap:6px;font-size:14px;color:var(--muted);padding:2px 0}
.card .r span:last-child{color:var(--ink)}
.card .get{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.card .get b{font-size:20px;font-weight:800}
.card .get span{font-size:14px;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:10px 0 0}
.copy{margin-top:12px;width:100%;border:1px solid var(--line);background:transparent;border-radius:12px;padding:11px;font-weight:700}

.jl{display:flex;align-items:center;gap:10px;width:100%;text-align:start;border:0;background:transparent;padding:11px 0;border-bottom:1px solid var(--line)}
.jl:last-child{border-bottom:0}
.jl .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jl .s{font-size:13px;color:var(--muted)}

.sec{font-size:15px;font-weight:700;color:var(--muted);margin:18px 2px 10px}
.jobcard{display:block;width:100%;text-align:start;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;margin-bottom:10px}
.jobcard:active{opacity:.85}
.jc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.badge{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted);flex:none}
.badge.ok{color:var(--good);border-color:var(--good)}
.jc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;text-align:center}
.jc-row small{display:block;color:var(--muted);font-size:12px}
.jc-paid{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;color:var(--muted)}
.claims .net{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--field);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;font-weight:700}
.claims .net b{font-size:24px;font-weight:800}
.claims .net.clear{border-color:var(--good);color:var(--good)}
.claimline small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.claimline{margin-top:12px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:500}
.warnc{color:var(--bad)}
#recvBox:empty{display:none}
.sum.two{grid-template-columns:1fr 1fr}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{border:1px solid var(--line);background:var(--field);border-radius:14px;padding:18px 12px;text-align:center}
.kind b{display:block;font-size:20px;margin-bottom:4px}
.kind span{font-size:13px;color:var(--muted)}
.kind:hover,.kind:focus-visible{border-color:var(--ink)}
.kindrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.buyrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buyf>span{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);margin-bottom:6px}
.buytotal{margin-top:10px;display:flex;justify-content:space-between;color:var(--muted)}
.buytotal b{color:var(--ink);font-size:18px}
.badges{display:flex;gap:6px;flex:none}
.jc-sub{font-size:13px;color:var(--muted);margin-top:4px}
.start{text-align:center;padding:30px 10px}
.start p{color:var(--muted);margin:0 0 16px}

.manual summary{cursor:pointer;font-weight:700}
.manual .note{margin:10px 0 0}
.field[dir=ltr]{text-align:left}

.toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:88%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="partners" id="partners"></div>
  <div class="tabs" id="tabs"></div>
  <p class="sharednote" id="sharednote"></p>
  <div id="main"></div>
  <details class="panel manual" id="manual">
    <summary>الإعدادات والمشاركة</summary>
    <div id="cfgBox"></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0 4px">
    <p class="note">نسخة احتياطية يدوية: انسخ بياناتك أو الصق بيانات وصلتك وادمجها. المصاريف الجديدة تنضاف، والمحذوفة ما تنحذف.</p>
    <button class="copy" id="exportBtn">نسخ كل بياناتي</button>
    <textarea class="field" id="importBox" rows="3" placeholder="الصق هنا البيانات اللي وصلتك" style="margin-top:10px"></textarea>
    <button class="copy" id="importBtn">دمج البيانات الملصوقة</button>
  </details>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => {
  const s = String(v == null ? '' : v)
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
    .replace('٫', '.').replace(/[,،\s]/g, '');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
};
const fmt = n => { let v = Math.round((+n || 0) * 100) / 100; if (Object.is(v, -0)) v = 0; return v.toLocaleString('en-US', {maximumFractionDigits: 2}); };
const N = n => `<span class="num">${fmt(n)}</span>`;
const sgn = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

let S = { partners: ['أنا', 'خويي'], pnSet: [false, false], jobs: [], pays: [], active: 'total' };
let draftFrom = 0;
let draftWho = 0;
let delArmed = false, delTimer = null;
const colors = ['var(--p0)', 'var(--p1)'];

/* ---------- config + local cache ---------- */
const LS = {
  get: k => { try { return localStorage.getItem(k); } catch(e){ return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch(e){} },
  del: k => { try { localStorage.removeItem(k); } catch(e){} }
};
let cfg = null, base = {};
const errText = e => (e && e.message) ? e.message : String(e);
const stamp = () => new Date().toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'});
const normDb = u => { u = String(u || '').trim().replace(/\/+$/, ''); return /^https:\/\/[^\s\/]+$/.test(u) ? u : ''; };
const normRoom = r => String(r || '').replace(/[^A-Za-z0-9_-]/g, '');
function randRoom(){
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789', a = new Uint32Array(18);
  (window.crypto || {getRandomValues: x => x.forEach((_, i) => x[i] = Math.random() * 4e9)}).getRandomValues(a);
  return Array.from(a, n => abc[n % abc.length]).join('');
}
function setCfg(db, room){
  db = normDb(db); room = normRoom(room);
  if (!db) return 'bad-db';
  if (room.length < 8) return 'bad-room';
  if (!cfg || cfg.room !== room || cfg.db !== db) base = {};
  cfg = {db, room}; LS.set('ps-cfg', JSON.stringify(cfg));
  return '';
}
function loadCfg(){
  try {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('db') && h.get('room')) {
      setCfg(h.get('db'), h.get('room'));
      history.replaceState(null, '', location.pathname + location.search);
    }
  } catch(e){}
  if (!cfg) { try { const c = JSON.parse(LS.get('ps-cfg') || 'null'); if (c && c.db && c.room) cfg = c; } catch(e){} }
  try {
    const c = JSON.parse(LS.get('ps-cache') || 'null');
    if (c && c.S) {
      S.partners = c.S.partners || S.partners; S.pnSet = c.S.pnSet || [false, false]; S.jobs = c.S.jobs || []; S.pays = c.S.pays || [];
      if (cfg && c.room === cfg.room) base = c.base || {};
    }
  } catch(e){}
}
function cacheWrite(){
  LS.set('ps-cache', JSON.stringify({room: cfg && cfg.room, S: {partners: S.partners, pnSet: S.pnSet, jobs: S.jobs, pays: S.pays}, base}));
}
function setStatus(msg, warn){
  const sn = $('#sharednote'); if (!sn) return;
  sn.textContent = msg; sn.className = 'sharednote' + (warn ? ' warn' : '');
}

/* ---------- flat model (field-level merge) ---------- */
const mkExp = x => ({who: +x.who === 1 ? 1 : 0, desc: String(x.desc || ''), amount: num(x.amount), ts: +x.ts || 0});
const mkPay = x => ({from: +x.from === 1 ? 1 : 0, desc: String(x.desc || ''), amount: num(x.amount), ts: +x.ts || 0});
const okRecv = v => (v === '0' || v === '1') ? v : '';
function toFlat(st){
  const f = {};
  if (st.pnSet[0]) f.p0 = String(st.partners[0]);
  if (st.pnSet[1]) f.p1 = String(st.partners[1]);
  st.jobs.forEach(j => {
    const b = 'jobs/' + j.id + '/';
    f[b + 'created'] = +j.created || 0;
    f[b + 'name'] = String(j.name || '');
    f[b + 'sale'] = String(j.sale == null ? '' : j.sale);
    f[b + 'split'] = j.split === 'capital' ? 'capital' : 'equal';
    if (okRecv(String(j.recv))) f[b + 'recv'] = String(j.recv);
    if (j.kind === 'car') f[b + 'kind'] = 'car';
    if (String(j.buy0 || '') !== '') f[b + 'buy0'] = String(j.buy0);
    if (String(j.buy1 || '') !== '') f[b + 'buy1'] = String(j.buy1);
    j.expenses.forEach(e => { f[b + 'expenses/' + e.id] = mkExp(e); });
  });
  (st.pays || []).forEach(x => { f['pays/' + x.id] = mkPay(x); });
  return f;
}
function flatFromTree(t){
  const f = {};
  if (!t || typeof t !== 'object') return f;
  if (t.p0 !== undefined) f.p0 = String(t.p0);
  if (t.p1 !== undefined) f.p1 = String(t.p1);
  const jobs = t.jobs || {};
  for (const id in jobs) {
    const j = jobs[id] || {}, b = 'jobs/' + id + '/';
    if (j.created !== undefined) f[b + 'created'] = +j.created || 0;
    if (j.name !== undefined) f[b + 'name'] = String(j.name);
    if (j.sale !== undefined) f[b + 'sale'] = String(j.sale);
    if (j.split !== undefined) f[b + 'split'] = j.split === 'capital' ? 'capital' : 'equal';
    if (okRecv(String(j.recv))) f[b + 'recv'] = String(j.recv);
    if (j.kind === 'car') f[b + 'kind'] = 'car';
    if (j.buy0 !== undefined && String(j.buy0) !== '') f[b + 'buy0'] = String(j.buy0);
    if (j.buy1 !== undefined && String(j.buy1) !== '') f[b + 'buy1'] = String(j.buy1);
    const ex = j.expenses || {};
    for (const eid in ex) f[b + 'expenses/' + eid] = mkExp(ex[eid] || {});
  }
  const pays = t.pays || {};
  for (const pid in pays) f['pays/' + pid] = mkPay(pays[pid] || {});
  return f;
}
function applyFlat(f){
  if (f.p0 !== undefined) { S.partners[0] = f.p0; S.pnSet[0] = true; }
  if (f.p1 !== undefined) { S.partners[1] = f.p1; S.pnSet[1] = true; }
  const byId = {};
  for (const k in f) {
    const m = k.match(/^jobs\/([^\/]+)\/(.+)$/); if (!m) continue;
    (byId[m[1]] = byId[m[1]] || {})[m[2]] = f[k];
  }
  const jobs = Object.keys(byId).map(id => {
    const d = byId[id];
    let j = S.jobs.find(x => x.id === id);
    if (!j) j = {id, created: 0, name: '', sale: '', split: 'equal', expenses: []};
    j.created = d.created !== undefined ? d.created : j.created;
    j.name = d.name !== undefined ? d.name : '';
    j.sale = d.sale !== undefined ? d.sale : '';
    j.split = d.split || 'equal';
    j.recv = okRecv(d.recv);
    j.kind = d.kind === 'car' ? 'car' : 'other';
    j.buy0 = d.buy0 !== undefined ? d.buy0 : '';
    j.buy1 = d.buy1 !== undefined ? d.buy1 : '';
    const ex = [];
    for (const k in d) if (k.startsWith('expenses/')) ex.push(Object.assign({id: k.slice(9)}, d[k]));
    ex.sort((x, y) => (x.ts - y.ts) || (x.id < y.id ? -1 : 1));
    j.expenses.length = 0; ex.forEach(e => j.expenses.push(e));
    return j;
  });
  jobs.sort((x, y) => (x.created - y.created) || (x.id < y.id ? -1 : 1));
  S.jobs = jobs;
  const pays = [];
  for (const k in f) if (k.startsWith('pays/')) pays.push(Object.assign({id: k.slice(5)}, f[k]));
  pays.sort((x, y) => (x.ts - y.ts) || (x.id < y.id ? -1 : 1));
  S.pays = pays;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* ---------- sync (online) ---------- */
let syncing = false, again = false, syncT;
function scheduleSync(ms){ clearTimeout(syncT); syncT = setTimeout(() => sync(false), ms || 500); }
function save(){ cacheWrite(); if (cfg) scheduleSync(); }
async function api(method, body){
  const r = await fetch(cfg.db + '/rooms/' + cfg.room + '.json', {method, body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) {
    let t = ''; try { t = (await r.text()).slice(0, 80); } catch(e){}
    throw new Error('HTTP ' + r.status + (t ? ' ' + t : ''));
  }
  return r.json();
}
async function sync(manual){
  if (!cfg) { if (manual) toast('اربط قاعدة البيانات أول (تحت في الإعدادات)'); return; }
  if (syncing) { again = true; return; }
  syncing = true;
  try {
    const remote = flatFromTree(await api('GET'));
    const local = toFlat(S);
    const before = JSON.stringify(local);
    const merged = {};
    new Set([...Object.keys(local), ...Object.keys(base), ...Object.keys(remote)]).forEach(k => {
      const v = same(local[k], base[k]) ? remote[k] : local[k];
      if (v !== undefined) merged[k] = v;
    });
    applyFlat(merged);
    const changed = JSON.stringify(toFlat(S)) !== before;
    const diff = {}; let n = 0;
    new Set([...Object.keys(merged), ...Object.keys(remote)]).forEach(k => {
      if (!same(merged[k], remote[k])) { diff[k] = merged[k] === undefined ? null : merged[k]; n++; }
    });
    if (n) await api('PATCH', diff);
    base = merged; cacheWrite();
    if (changed) {
      if (!['total', 'claims', 'new'].includes(S.active) && !jobById(S.active)) S.active = 'total';
      renderTabs();
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
      if (!typing) { renderPartners(); renderMain(); }
      else {
        const j = jobById(S.active);
        if (j && $('#expList')) { renderExpenses(j); renderResults(j); }
      }
    }
    setStatus('مشترك ✓ آخر تحديث ' + stamp());
    if (manual) toast(changed ? 'تم التحديث' : 'ما فيه جديد');
  } catch(e){
    setStatus('تعذر الاتصال بقاعدة البيانات: ' + errText(e), true);
    if (manual) toast('ما اشتغل التحديث');
  } finally {
    syncing = false;
    if (again) { again = false; scheduleSync(100); }
  }
}

/* ---------- calc ---------- */
const isCar = j => j.kind === 'car';
function calc(j){
  // buy[i] = اللي دفعه الشريك i في قيمة السيارة، exp[i] = اللي دفعه في المصاريف، cap[i] = المجموع (رأس ماله)
  const buy = isCar(j) ? [num(j.buy0), num(j.buy1)] : [0, 0];
  const exp = [0, 0];
  j.expenses.forEach(e => exp[e.who] += num(e.amount));
  const cap = [buy[0] + exp[0], buy[1] + exp[1]];
  const buyT = buy[0] + buy[1], expT = exp[0] + exp[1];
  const cost = cap[0] + cap[1];
  const sale = num(j.sale);
  const done = sale > 0;
  const profit = sale - cost;
  const sh = [profit / 2, profit / 2]; // كل واحد يرجع له رأس ماله، والربح (أو الخسارة) نص بنص
  return {buy, exp, buyT, expT, cap, cost, sale, done, profit, sh, get: [cap[0] + sh[0], cap[1] + sh[1]]};
}
const EPS = 0.005;
// المطالبات: اللي استلم فلوس البيع يعطي شريكه نصيبه (رأس ماله + ربحه)
// قبل البيع (نص بنص): كل واحد عليه نص التكلفة، فاللي دفع أقل يطلبه اللي دفع أكثر نص الفرق.
// حسب رأس المال: كل واحد يملك قد اللي دفعه، فما فيه مطالبة قبل البيع.
function preClaim(j, c){ return (c.cap[0] - c.cap[1]) / 2; } // >0: الشريك 1 عليه للشريك 0
// بعد البيع: اللي استلم فلوس البيع يعطي شريكه حقه (رأس ماله + ربحه). هذا يشمل حساب قبل البيع.
function claims(){
  const C = {pre: [0, 0], fin: [0, 0], owe: [0, 0], paid: [0, 0], preJobs: [], finJobs: [], noRecv: []};
  // pre[i] / fin[i] = اللي يطلبه الشريك i من الثاني
  S.jobs.forEach(j => {
    const c = calc(j);
    if (c.done && okRecv(String(j.recv))) {
      const r = +j.recv, o = 1 - r, amt = c.get[o];
      if (amt >= 0) C.fin[o] += amt; else C.fin[r] += -amt;
      C.finJobs.push({j, c, r, o, amt});
      return;
    }
    if (c.done) C.noRecv.push(j);
    if (!c.cost) return;
    const d = preClaim(j, c);
    if (d > 0) C.pre[0] += d; else if (d < 0) C.pre[1] += -d;
    C.preJobs.push({j, c, d, noRecv: c.done});
  });
  S.pays.forEach(x => { C.paid[x.from] += num(x.amount); });
  [0,1].forEach(i => C.owe[i] = C.pre[i] + C.fin[i]);
  // net > 0: الشريك 0 لازم يحوّل للشريك 1 ، net < 0: العكس
  let net = C.owe[1] - C.owe[0] - C.paid[0] + C.paid[1];
  if (Math.abs(net) < EPS) net = 0;
  C.net = net;
  C.debtor = net > 0 ? 0 : net < 0 ? 1 : -1;
  C.amount = Math.abs(net);
  return C;
}

// تحويل شغلة قديمة لسيارة: ينقل مصروف "قيمة السيارة" لخانة الشراء
function convertToCar(j){
  const isPrice = e => /قيم[ةه]\s*(ال)?سي?ار[ةه]/.test(e.desc || '');
  const moved = [num(j.buy0), num(j.buy1)]; let n = 0;
  j.expenses = j.expenses.filter(e => { if (isPrice(e)) { moved[e.who] += num(e.amount); n++; return false; } return true; });
  j.kind = 'car';
  j.buy0 = moved[0] ? String(Math.round(moved[0] * 100) / 100) : '';
  j.buy1 = moved[1] ? String(Math.round(moved[1] * 100) / 100) : '';
  save(); renderMain();
  toast(n ? 'تحولت لسيارة، وانتقلت "قيمة السيارة" لخانة الشراء' : 'تحولت لسيارة، اكتب قيمة الشراء');
}

function preLine(j, c){
  if (!c.cost) return '';
  const d = preClaim(j, c);
  if (Math.abs(d) < EPS) return 'دافعين بالتساوي، ما أحد يطلب أحد';
  return d > 0 ? `${pn(0)} يطلب ${pn(1)} ${fmt(d)} (نص الفرق في المدفوع)`
               : `${pn(1)} يطلب ${pn(0)} ${fmt(-d)} (نص الفرق في المدفوع)`;
}
function jobClaimLine(j, c){
  if (!okRecv(String(j.recv))) return '';
  const r = +j.recv, o = 1 - r, amt = c.get[o];
  if (Math.abs(amt) < EPS) return `${pn(r)} استلم الفلوس، وما عليه شي`;
  return amt > 0 ? `${pn(r)} استلم الفلوس، فيعطي ${pn(o)} ${fmt(amt)}`
                 : `${pn(r)} استلم الفلوس، و${pn(o)} يعطيه ${fmt(-amt)} (خسارة)`;
}

/* ---------- totals ---------- */
function totals(){
  const T = {costAll:0, sale:0, profit:0, paidAll:[0,0], profitSh:[0,0], getSold:[0,0], stuck:[0,0], sold:0, unsold:0};
  S.jobs.forEach(j => {
    const c = calc(j);
    T.costAll += c.cost;
    [0,1].forEach(i => T.paidAll[i] += c.cap[i]);
    if (c.done) {
      T.sold++; T.sale += c.sale; T.profit += c.profit;
      [0,1].forEach(i => { T.profitSh[i] += c.sh[i]; T.getSold[i] += c.get[i]; });
    } else if (c.cost) {
      T.unsold++; [0,1].forEach(i => T.stuck[i] += c.cap[i]);
    }
  });
  return T;
}

        </div>`).join('')}</div>
      ${C.noRecv.length ? `<p class="note warnc">${C.noRecv.length} شغلة مباعة ما تحدد مين استلم فلوسها، فانحسبت كأنها ما انباعت.</p>` : ''}
      ${withLink ? '<button class="copy" id="goClaims">تفاصيل المطالبات والتحويلات</button>' : ''}
    </div>`;
}
function renderClaims(){
  const C = claims();
  const openRow = (x, right) => `
        <button class="jl" data-open="${x.j.id}">
          <div class="n">${esc(jobTitle(x.j))}<div class="s">${right.sub}</div></div>
          <div class="s" style="text-align:end">${right.side}</div>
        </button>`;
  const who = (i, v) => `${esc(pn(i))} يطلب<br><b class="num" style="color:var(--ink)">${fmt(v)}</b>`;
  $('#main').innerHTML = claimsSummaryHTML(C, false) + `
    <div class="panel">
      <h2>قبل البيع (لحد الحين)</h2>
      <p class="note" style="margin:0 0 6px">اللي دفع أكثر يطلب الثاني نص الفرق، عشان تصيرون دافعين بالتساوي. مو لازم تحوّلونه الحين: إذا ما حولتوه ينخصم وقت البيع، والنتيجة نفسها.</p>
      ${C.preJobs.length ? C.preJobs.map(x => openRow(x, {
          sub: `تكلفة ${fmt(x.c.cost)} — ${esc(pn(0))} ${fmt(x.c.cap[0])}، ${esc(pn(1))} ${fmt(x.c.cap[1])}` + (x.noRecv ? '<br><span class="warnc">مباعة، بس ما تحدد مين استلم الفلوس</span>' : '') + '',
          side: Math.abs(x.d) < EPS ? 'ما فيه مطالبة' : x.d > 0 ? who(0, x.d) : who(1, -x.d)
        })).join('') : '<div class="empty">ما فيه شغلات ما انباعت.</div>'}
    </div>

    <div class="panel">
      <h2>التسوية النهائية (بعد البيع)</h2>
      <p class="note" style="margin:0 0 6px">كل واحد يرجع له رأس ماله، والربح نص بنص. فاللي استلم فلوس البيع يعطي شريكه رأس ماله ونص الربح.</p>
      ${C.finJobs.length ? C.finJobs.map(x => openRow(x, {
          sub: `بيع ${fmt(x.c.sale)} — استلمها ${esc(pn(x.r))}`,
          side: Math.abs(x.amt) < EPS ? 'ما فيه مطالبة' : x.amt > 0 ? who(x.o, x.amt) : who(x.r, -x.amt)
        })).join('') : '<div class="empty">ما فيه شغلات مباعة محدد مين استلم فلوسها.</div>'}
    </div>

    <div class="panel">
      <h2>التحويلات بينكم</h2>
      <div id="payList"></div>
      <div class="form">
        <div class="seg" id="payFrom">
          ${[0,1].map(i => `<button data-f="${i}" style="--c:${colors[i]}" aria-pressed="${draftFrom === i}">${esc(pn(i))} حوّل</button>`).join('')}
        </div>
        <div class="row2">
          <input class="field" id="pDesc" placeholder="ملاحظة (اختياري)" aria-label="ملاحظة التحويل">
          <input class="field" id="pAmt" inputmode="decimal" placeholder="المبلغ" aria-label="مبلغ التحويل">
        </div>
        <button class="primary" id="addPay">تسجيل التحويل</button>
        ${C.debtor >= 0 ? `<button class="copy" id="settle" style="margin-top:0">سجّل إن ${esc(pn(C.debtor))} حوّل ${fmt(C.amount)} (تسوية كاملة)</button>` : ''}
      </div>
    </div>
    <button class="copy" id="copyClaims" style="margin-top:0;margin-bottom:12px">نسخ ملخص المطالبات</button>`;

  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { S.active = b.dataset.open; renderTabs(); renderMain(); window.scrollTo(0, 0); });
  $('#payFrom').querySelectorAll('button').forEach(b => b.onclick = () => {
    draftFrom = +b.dataset.f;
    $('#payFrom').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.f === draftFrom));
  });
  const addPay = (from, amt, desc) => {
    S.pays.push({id: uid(), from, amount: Math.round(amt * 100) / 100, desc, ts: Date.now()});
    save(); renderClaims(); toast('انسجّل التحويل');
  };
  $('#addPay').onclick = () => {
    const amt = num($('#pAmt').value);
    if (!(amt > 0)) { toast('اكتب مبلغ أكبر من صفر'); $('#pAmt').focus(); return; }
    addPay(draftFrom, amt, $('#pDesc').value.trim());
  };
  ['pDesc', 'pAmt'].forEach(id => $('#' + id).addEventListener('keydown', e => { if (e.key === 'Enter') $('#addPay').click(); }));
  const st = $('#settle');
  if (st) st.onclick = () => addPay(C.debtor, C.amount, 'تسوية كاملة');
  $('#copyClaims').onclick = () => copy(claimsText(C));
  renderPays();
}
function renderPays(){
  const el = $('#payList');
  if (!S.pays.length) { el.innerHTML = '<div class="empty">ما فيه تحويلات مسجلة.</div>'; return; }
  el.innerHTML = S.pays.map(x => `
    <div class="exp">
      <span class="dot" style="background:${colors[x.from]}"></span>
      <div class="t"><div class="d">${esc(pn(x.from))} ← حوّل إلى ${esc(pn(1 - x.from))}</div><div class="w">${esc(x.desc || new Date(x.ts).toLocaleDateString('en-GB'))}</div></div>
      <div class="a">${N(num(x.amount))}</div>
      <button class="x" data-delp="${x.id}" aria-label="حذف التحويل">×</button>
    </div>`).join('');
  el.querySelectorAll('[data-delp]').forEach(b => b.onclick = () => {
    S.pays = S.pays.filter(x => x.id !== b.dataset.delp);
    save(); renderClaims();
  });
}
function claimsText(C){
  let t = `المطالبات لحد الحين\n${netText(C)}${C.debtor < 0 ? '' : ': ' + fmt(C.amount)}\n\n`;
  [0,1].forEach(i => t += `${pn(i)}: يطلب قبل البيع ${fmt(C.pre[i])}، وبعد البيع ${fmt(C.fin[i])}، وحوّل ${fmt(C.paid[i])}\n`);
  if (C.preJobs.length) {
    t += '\nقبل البيع:\n';
    C.preJobs.forEach(x => t += `- ${jobTitle(x.j)}: ${preLine(x.j, x.c)}\n`);
  }
  if (C.finJobs.length) {
    t += '\nالتسوية النهائية:\n';
    C.finJobs.forEach(x => t += `- ${jobTitle(x.j)}: ${jobClaimLine(x.j, x.c)}\n`);
  }
  if (S.pays.length) {
    t += '\nالتحويلات:\n';
    S.pays.forEach(x => t += `- ${pn(x.from)} حوّل إلى ${pn(1 - x.from)} ${fmt(num(x.amount))}${x.desc ? ' (' + x.desc + ')' : ''}\n`);
  }
  if (C.noRecv.length) t += `\nتنبيه: ${C.noRecv.length} شغلة مباعة ما تحدد مين استلم فلوسها.`;
  return t.trim();
}

/* ---------- share text ---------- */
function jobText(j){
  const c = calc(j);
  let t = `${jobTitle(j)}\n`;
  if (isCar(j)) t += `قيمة السيارة: ${fmt(c.buyT)} (${pn(0)} ${fmt(c.buy[0])}، ${pn(1)} ${fmt(c.buy[1])})\n${j.expenses.length ? 'المصاريف:\n' : ''}`;
  j.expenses.forEach(e => t += `- ${e.desc || 'بدون وصف'} (${pn(e.who)}): ${fmt(num(e.amount))}\n`);
  t += isCar(j) ? `\nالمصاريف: ${fmt(c.expT)}\nالتكلفة الكاملة: ${fmt(c.cost)}\n` : `\nالتكلفة: ${fmt(c.cost)}\n`;
  if (!c.done) return t + `${pn(0)} دفع ${fmt(c.cap[0])}\n${pn(1)} دفع ${fmt(c.cap[1])}\n\nلحد الحين: ${preLine(j, c)}`;
  t += `سعر البيع: ${fmt(c.sale)}\nالربح: ${fmt(c.profit)}\n\n`;
  [0,1].forEach(i => t += `${pn(i)}: رأس المال ${fmt(c.cap[i])} + ربح ${fmt(c.sh[i])} = ${fmt(c.get[i])}\n`);
  const cl = jobClaimLine(j, c);
  t += `\n${cl || 'لحد الحين: ' + preLine(j, c)}`;
  return t.trim();
}
function totalText(T){
  let t = `الإجمالي (${S.jobs.length} شغلة: ${T.sold} مباعة، ${T.unsold} ما انباعت)\nإجمالي التكلفة: ${fmt(T.costAll)}\nالمبيعات: ${fmt(T.sale)}\nالربح: ${fmt(T.profit)}\n\n`;
  [0,1].forEach(i => {
    t += `${pn(i)}: دفع ${fmt(T.paidAll[i])} — ربح ${fmt(T.profitSh[i])} — يستلم ${fmt(T.getSold[i])}`;
    if (T.stuck[i]) t += ` — واقف ${fmt(T.stuck[i])}`;
    t += '\n';
  });
  t += '\nالشغلات:\n';
  S.jobs.forEach(j => { const c = calc(j); t += `- ${jobTitle(j)}: تكلفة ${fmt(c.cost)}` + (c.done ? `، بيع ${fmt(c.sale)}، ربح ${fmt(c.profit)}` : '، ما انباعت') + '\n'; });
  return t.trim();
}
function copy(text, msg){
  const done = () => toast(msg || 'اننسخ الملخص');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){ toast('ما قدرت أنسخ'); }
    ta.remove();
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- manual share ---------- */
const enc = o => 'PSH1:' + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec = t => JSON.parse(decodeURIComponent(escape(atob(t.trim().replace(/^PSH1:/, '')))));
function importData(text){
  let d;
  try { d = dec(text); if (!d || !Array.isArray(d.jobs)) throw 0; } catch(e){ toast('البيانات غير صحيحة'); return false; }
  let added = 0, merged = 0;
  d.jobs.forEach(rj => {
    const l = S.jobs.find(j => j.id === rj.id);
    if (!l) { S.jobs.push(rj); added++; return; }
    (rj.expenses || []).forEach(e => { if (!l.expenses.some(x => x.id === e.id)) { l.expenses.push(e); merged++; } });
    if (!l.name && rj.name) l.name = rj.name;
    if (!num(l.sale) && num(rj.sale)) l.sale = rj.sale;
    if (!okRecv(String(l.recv)) && okRecv(String(rj.recv))) l.recv = String(rj.recv);
    if (rj.kind === 'car' && l.kind !== 'car') { l.kind = 'car'; }
    if (!num(l.buy0) && num(rj.buy0)) l.buy0 = rj.buy0;
    if (!num(l.buy1) && num(rj.buy1)) l.buy1 = rj.buy1;
  });
  let pAdded = 0;
  (d.pays || []).forEach(x => { if (x && x.id && !S.pays.some(y => y.id === x.id)) { S.pays.push(Object.assign({id: x.id}, mkPay(x))); pAdded++; } });
  S.pays.sort((x, y) => (x.ts - y.ts) || (x.id < y.id ? -1 : 1));
  S.jobs.sort((x, y) => (x.created || 0) - (y.created || 0));
  save(); renderPartners(); renderTabs(); renderMain();
  toast(`تم الدمج: ${added} شغلة، ${merged} مصروف، ${pAdded} تحويل`);
  return true;
}
$('#exportBtn').onclick = () => copy(enc({partners: S.partners, jobs: S.jobs, pays: S.pays}), 'اننسخت البيانات، ارسلها لخويك');
$('#importBtn').onclick = () => { const b = $('#importBox'); if (b.value.trim() && importData(b.value)) b.value = ''; };

/* ---------- settings ---------- */
function renderSettings(){
  const el = $('#cfgBox');
  if (!cfg) {
    el.innerHTML = `
      <p class="note">اربط التطبيق بقاعدة بيانات عشان تتحدث الأرقام بينك وبين خويك.</p>
      <input class="field" id="cfgDb" dir="ltr" placeholder="https://اسم-مشروعك-default-rtdb.firebaseio.com" style="margin-top:10px" aria-label="رابط قاعدة البيانات">
      <input class="field" id="cfgRoom" dir="ltr" value="${randRoom()}" style="margin-top:8px" aria-label="رمز المجموعة">
      <p class="note">رمز المجموعة هو السر اللي يحمي بياناتكم، لا تعطيه لأحد غير خويك.</p>
      <button class="copy" id="cfgGo">ربط وبدء المزامنة</button>`;
    $('#cfgGo').onclick = () => {
      const err = setCfg($('#cfgDb').value, $('#cfgRoom').value);
      if (err === 'bad-db') return toast('الرابط غير صحيح، لازم يبدأ بـ https://');
      if (err === 'bad-room') return toast('رمز المجموعة لازم 8 حروف أو أرقام على الأقل');
      renderSettings(); save(); sync(true);
    };
  } else {
    el.innerHTML = `
      <p class="note">مربوط بقاعدة البيانات ✓ أي واحد يفتح رابط الدعوة يشوف نفس البيانات.</p>
      <button class="copy" id="inviteBtn">نسخ رابط الدعوة لخويك</button>
      <button class="copy" id="cfgReset">فصل الربط</button>`;
    $('#inviteBtn').onclick = () => copy(location.href.split('#')[0] + '#db=' + encodeURIComponent(cfg.db) + '&room=' + cfg.room, 'اننسخ رابط الدعوة، ارسله لخويك');
    $('#cfgReset').onclick = () => {
      cfg = null; base = {}; LS.del('ps-cfg'); renderSettings();
      setStatus('انفصل الربط. بياناتك محفوظة في هذا الجهاز بس.', true);
    };
  }
}

/* ---------- init ---------- */
loadCfg();
S.active = 'total';
renderSettings(); renderPartners(); renderTabs(); renderMain();
if (cfg) { setStatus('جاري الاتصال…'); sync(false); }
else { setStatus('غير مربوط بقاعدة بيانات: بياناتك محفوظة في هذا الجهاز بس. افتح "الإعدادات والمشاركة" تحت للربط.', true); $('#manual').open = true; }
setInterval(() => { if (cfg && !document.hidden) sync(false); }, 30 * 60 * 1000);  // كل نص ساعة، وبعد كل تعديل، وعند فتح التطبيق
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg) sync(false); });
</script>
